# Netlify reads this beside the site it builds. Two things are declared here: the
# functions, and when to build at all — only when something lv is drawn from has changed
# since the last deploy, lv itself, gallery or core. The command runs from the base
# directory, so the two libraries are named from there. How the site itself is built
# stays where it already is, in Netlify's own settings.

[build]
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../gallery ../core"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
